<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إعادة تعيين كلمة المرور | يوسف لمستلزمات العربيات</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@300;400;500;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auth.css">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
</head>
<body>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="card">
    <div class="shield">
      <svg viewBox="0 0 24 24" fill="none"><path d="M7 11V8a5 5 0 0110 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="4" y="11" width="16" height="9" rx="2" stroke="currentColor" stroke-width="2"/></svg>
    </div>
    <h1>كلمة مرور جديدة</h1>
    <p class="lead">اختر كلمة مرور قوية لا تقل عن 8 أحرف. بعد التغيير هيتم تسجيل الخروج من كل الأجهزة تلقائيًا.</p>
    <form id="resetForm">
      <div class="field">
        <label for="password">كلمة المرور الجديدة</label>
        <input id="password" type="password" minlength="8" required autocomplete="new-password" placeholder="8 أحرف على الأقل" />
      </div>
      <div class="field">
        <label for="confirm">تأكيد كلمة المرور</label>
        <input id="confirm" type="password" minlength="8" required autocomplete="new-password" placeholder="أعد كتابتها" />
      </div>
      <button type="submit" id="submitBtn">تغيير كلمة المرور</button>
    </form>
    <div id="status" class="status"></div>
    <a class="back-link" href="/account.html">← الذهاب لصفحة الدخول</a>
  </div>
  <script src="/ui-utils.js"></script>
  <script src="/csrf.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token') || '';
    const status = document.getElementById('status');
    const btn = document.getElementById('submitBtn');

    function show(msg, ok) {
      status.classList.add('show');
      status.classList.toggle('ok', !!ok);
      status.textContent = msg;
    }
    if (!token) {
      show('الرابط ناقص أو غير صالح. اطلب رابط استعادة جديد.', false);
      btn.disabled = true;
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) { show('كلمتا المرور غير متطابقتين', false); return; }
      btn.disabled = true;
      btn.textContent = 'جاري الحفظ...';
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.error) {
        show(data.error || 'تعذر تغيير كلمة المرور', false);
        btn.disabled = false;
        btn.textContent = 'تغيير كلمة المرور';
        return;
      }
      show(data.message || 'تم تغيير كلمة المرور بنجاح.', true);
      setTimeout(() => { window.location.href = '/account.html'; }, 1800);
    });
  </script>
</body>
</html>
