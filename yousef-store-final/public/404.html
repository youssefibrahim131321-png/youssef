<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="/ui-utils.js"></script>
<script src="/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الصفحة مش موجودة | يوسف لمستلزمات العربيات</title>
<meta name="description" content="الرابط اللي فتحته مش موجود أو اتغيّر. ارجع للصفحة الرئيسية وشوف المنتجات المتاحة.">
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="/theme.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0d0f14;color:#f5f6fb;font-family:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;padding:24px;text-align:center}
  .code{font-size:72px;font-weight:900;line-height:1;color:#e8632c;margin:0 0 8px;font-family:'Cairo',system-ui,sans-serif}
  h1{font-size:22px;margin:0 0 10px}
  p{color:#c2c7d6;margin:0 0 22px;font-size:15px;line-height:1.8;max-width:38ch}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  a{display:inline-block;min-height:44px;padding:12px 22px;border-radius:12px;border:1px solid #e8632c;background:#e8632c;color:#141414;font:inherit;font-weight:700;text-decoration:none}
  a.ghost{background:transparent;color:#f5f6fb;border-color:rgba(255,255,255,.25)}
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>الصفحة دي مش موجودة</h1>
    <p>يمكن الرابط اتغيّر أو المنتج اتشال من المتجر. جرّب ترجع للرئيسية وتدوّر من هناك.</p>
    <div class="row">
      <a href="/">الصفحة الرئيسية</a>
      <a class="ghost" href="/#products">تصفّح المنتجات</a>
    </div>
  </main>
</body>
</html>
