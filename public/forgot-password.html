<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
<script src="/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نسيت كلمة المرور | يوسف لمستلزمات العربيات</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@300;400;500;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auth.css">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
</head>
<body>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="card">
    <div class="shield">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v6c0 4.6-3 8.4-7 9-4-.6-7-4.4-7-9V6l7-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 8v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 15h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <h1>نسيت كلمة المرور؟</h1>
    <p class="lead">اكتب بريدك الإلكتروني وهنبعتلك رابط لإعادة تعيين كلمة المرور. الرابط صالح لمدة ساعة واحدة ويُستخدم مرة واحدة فقط. تصلح للعملاء وللمسؤولين.</p>
    <form id="forgotForm">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" placeholder="you@example.com" required autocomplete="username" />
      </div>
      <button type="submit" id="submitBtn">إرسال رابط الاستعادة</button>
    </form>
    <div id="status" class="status"></div>
    <div id="devBox" class="secret-box" hidden></div>
    <div class="links">
      <a href="/account.html">دخول العملاء</a>
      <a href="/admin-login.html">دخول المسؤول</a>
    </div>
    <a class="back-link" href="/">← العودة إلى المتجر</a>
  </div>
  <script src="/ui-utils.js"></script>
  <script src="/csrf.js"></script>
  <script>
    const form = document.getElementById('forgotForm');
    const status = document.getElementById('status');
    const devBox = document.getElementById('devBox');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'جاري الإرسال...';
      const email = document.getElementById('email').value.trim().toLowerCase();
      let data = {};
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        data = await res.json().catch(() => ({}));
        status.classList.add('show');
        status.classList.toggle('ok', res.ok && !data.error);
        status.textContent = data.error || data.message || 'تم الإرسال.';
      } catch (err) {
        status.classList.add('show');
        status.classList.remove('ok');
        status.textContent = 'تعذر الاتصال بالخادم، حاول تاني.';
      }
      if (data.devResetLink) {
        devBox.hidden = false;
        devBox.textContent = 'وضع التطوير (مفيش مزوّد بريد متحدد): ';
        const link = document.createElement('a');
        link.setAttribute('href', data.devResetLink);
        link.textContent = 'افتح رابط إعادة التعيين';
        devBox.appendChild(link);
      }
      btn.disabled = false;
      btn.textContent = 'إرسال رابط الاستعادة';
    });
  </script>
</body>
</html>
